# adapters/cx.conf — OpenAI Codex CLI worker adapter
#
# 格式與限制見 adapters/cc.conf 檔頭。

name=codex
command=codex

detect=OpenAI Codex|YOLO mode|/model to change|gpt-[0-9]

ready=YOLO mode|/model to change|gpt-[0-9]

trust=trust this folder|trust the contents of this directory|Do you trust

# 同樣只抓結構性訊號,不抓動詞
busy=Esc to interrupt|esc to interrupt|working|\([0-9]+m [0-9]+s|\([0-9]+s +·|\([0-9]+s +•

# codex 收長訊息會卡在這裡:內容停在輸入框顯示 [Pasted Content NNNN chars] 但不執行,
# 而送訊指令仍回報「已派給」——這是假訊號。派工請用 `fleet task`(送短訊指向 brief 檔)。
stuck=\[Pasted Content [0-9]+ chars\]|Press up to edit queued messages

asking=Do you want to|Allow command|❯ 1\.

# codex 畫面沒有 context 百分比標記,這一欄留空 → 看板顯示 -
ctx=

composer=❯[[:space:]]+[^[:space:]]

# 自動應答:codex 的「降級到快模型」攔截框一律選 2(等強模型,不降級品質)
autoreply1_match=Retry with a faster model
autoreply1_keys=2
