# adapters/cc.conf — Claude Code worker adapter
#
# 這是**資料檔不是程式碼**。lib/signals.sh、libexec/fleet-mon、libexec/fleet-state
# 都從這裡讀同一份 regex。舊版把同一組 regex 複製到 4 個檔案,結果 4 份各自漂移:
# board 少了 [Pasted Content、fleet wait 甚至去抓 spinner 動詞。
#
# 語法限制(兩個消費端的交集):
#   - ERE,同時要能餵給 `grep -E`(LC_ALL=C)與 python `re`
#   - **不可使用含多位元組字元的字元集**(如 [·•])。C locale 下那會被拆成
#     個別位元組,比對結果是錯的。要多選一律用 alternation 展開。
#   - 反斜線照 ERE 寫,不需要為 shell 再跳脫一層

name=claude
command=claude

# 這個 pane 是不是這種 CLI(fleet discover 用)
# 這裡要放「跑久了也還在畫面上」的特徵。只放啟動 banner 的字樣不夠——
# 一個開了很久的 pane,banner 早就捲出 scrollback 了(實測 2000 行 history 都找不到),
# 於是 discover 會漏掉真的 worker。⏺ / ⎿ 這些工具輸出符號才是長期穩定的訊號。
detect=bypass permissions|Claude Code|for shortcuts|esc to interrupt|Ran [0-9]+ shell command|⏺ |⎿

# 新開之後,畫面出現什麼算「起來了」(fleet up 用)
ready=for shortcuts|bypass permissions on

# 首次進新目錄的信任提示,自動按 Enter 過
trust=trust this folder|trust the contents of this directory|Do you trust

# 忙碌判定。
# **絕對不要抓 spinner 動詞** —— Claude Code 的動詞是隨機的
# (Metamorphosing / Boondoggling / Sautéed / Levitating / Razzmatazzing…),
# 抓字必漏,漏了就把正在幹活的 worker 誤報成閒置 → 狂發假警報。
# 假警報比沒警報更糟。這裡只抓結構性訊號。
busy=esc to interrupt|Esc to interrupt|without interrupting|shell still running|Running [0-9]+ shell|↓ +[0-9]|\([0-9]+m [0-9]+s|\([0-9]+s +·|\([0-9]+s +•

# 卡住訊號。注意:只有「不忙 + 有這個訊號」才算真卡住。
# worker 忙的時候收到訊息會排隊顯示 Press up to edit queued messages,
# 做完自然會消化,那是正常的。
stuck=Press up to edit queued messages|\[Pasted Content [0-9]+ chars\]

# 停在互動選單等人回答
asking=Do you want to|Would you like to|❯ 1\.|Ready to submit

# 剩餘 context 百分比(第一個捕獲群組)。抓不到就顯示 -。
ctx=◔ *([0-9]+)%

# composer 行:偵測「使用者正在打字」用。後面若有非空白字元就不可插隊注入。
composer=❯[[:space:]]+[^[:space:]]
